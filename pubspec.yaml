name: app_bank
description: Premium Flutter Banking App powered by lux_blocks
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ★ UI Library — 76 ready-made blocks
  lux_blocks:
    path: ../ui_test/blocks_flutter

  # State Management
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^15.1.2

  # Icons (also transitive from lux_blocks)
  lucide_icons: ^0.257.0

  # Banking-specific
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
